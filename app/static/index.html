<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Always-On Paper Bot</title><style>body{font-family:system-ui;background:#0e1117;color:#eee;max-width:1050px;margin:30px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#181d27;border:1px solid #303849;border-radius:12px;padding:15px}.value{font-size:1.4rem;font-weight:700}.warn{border-color:#8d6b17}button{padding:11px 15px;margin:10px 7px 10px 0;border:0;border-radius:8px;font-weight:700}pre{white-space:pre-wrap}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #303849;text-align:left}</style></head><body><h1>Always-On Coinbase Paper Bot</h1><div class="card warn">Paper money only. Railway keeps this running when the browser closes. It has no access to your Coinbase funds.</div><div id="cards" class="grid" style="margin-top:14px"></div><button onclick="post('/api/buy')">Paper Buy</button><button onclick="post('/api/sell')">Paper Sell</button><button onclick="post('/api/auto/start')">Start Auto</button><button onclick="post('/api/auto/stop')">Stop Auto</button><button onclick="reset()">Reset</button><div class="grid"><div class="card"><h2>Signal</h2><pre id="signal">Loading…</pre></div><div class="card"><h2>Position</h2><pre id="position">None</pre></div></div><div class="card" style="margin-top:14px"><h2>Trades</h2><div id="trades"></div></div><script>const money=x=>Number(x||0).toLocaleString(undefined,{style:'currency',currency:'USD'});async function load(){const x=await fetch('/api/status?'+Date.now()).then(r=>r.json());const items=[['Product',x.product_id],['Price',money(x.last_price)],['Cash',money(x.cash)],['Equity',money(x.equity)],['Realized P/L',money(x.realized_pnl)],['Fees',money(x.fees_paid)],['Auto',x.auto_trading?'Running':'Stopped']];cards.innerHTML=items.map(([a,b])=>`<div class=card><div>${a}</div><div class=value>${b}</div></div>`).join('');signal.textContent=JSON.stringify(x.last_signal||{},null,2)+(x.last_error?'\nError: '+x.last_error:'');position.textContent=x.position?JSON.stringify(x.position,null,2):'None';const rows=(x.trades||[]).slice(-15).reverse();trades.innerHTML=rows.length?`<table><tr><th>Side</th><th>Price</th><th>Fee</th><th>P/L</th><th>Reason</th></tr>${rows.map(t=>`<tr><td>${t.side}</td><td>${money(t.price)}</td><td>${money(t.fee)}</td><td>${money(t.pnl)}</td><td>${t.reason}</td></tr>`).join('')}</table>`:'No trades yet.'}async function post(p){const r=await fetch(p,{method:'POST'});if(!r.ok)alert((await r.json()).detail||'Action failed');load()}async function reset(){if(confirm('Reset paper account?'))await post('/api/reset')}load();setInterval(load,5000)</script></body></html>
