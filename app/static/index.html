<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coinbase Paper Bot V4</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d1118;color:#eef2f7;max-width:1120px;margin:28px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:#171d27;border:1px solid #30394a;border-radius:12px;padding:15px}
.value{font-size:1.4rem;font-weight:750}.label{color:#9ca8ba;font-size:.86rem}
.warn{border-color:#8c6b19;background:#221b0c}
button{padding:12px 16px;margin:10px 8px 10px 0;border:0;border-radius:9px;font-weight:750;cursor:pointer}
.buy{background:#38c77c}.sell{background:#ef6b6b}.secondary{background:#394458;color:#fff}.danger{background:#913d49;color:#fff}
pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #30394a;text-align:left}.good{color:#63dda0}.bad{color:#ff7f7f}
</style>
</head>
<body>
<h1>Always-On Coinbase Paper Bot V4</h1>
<div class="card warn"><strong>Paper money only.</strong> Aggressive configuration with hard position, cash, drawdown, cooldown, and loss-streak controls. No profit guarantee.</div>
<div id="cards" class="grid" style="margin-top:14px"></div>
<div>
<button class="buy" onclick="post('/api/buy')">Paper Buy</button>
<button class="sell" onclick="post('/api/sell')">Paper Sell</button>
<button class="secondary" onclick="post('/api/auto/start')">Start Auto</button>
<button class="secondary" onclick="post('/api/auto/stop')">Stop Auto</button>
<button class="danger" onclick="resetAccount()">Reset</button>
</div>
<div class="grid">
<div class="card"><h2>Signal and costs</h2><pre id="signal">Loading…</pre></div>
<div class="card"><h2>Position</h2><pre id="position">None</pre></div>
</div>
<div class="card" style="margin-top:14px"><h2>Recent trades</h2><div id="trades">No trades yet.</div></div>
<script>
const money=x=>Number(x||0).toLocaleString(undefined,{style:"currency",currency:"USD"});
async function load(){
 const r=await fetch("/api/status?"+Date.now()); const x=await r.json(); const s=x.last_signal||{};
 const cards=[
 ["Version",x.version],["Product",x.product_id],["Live price",money(x.last_price)],
 ["Paper cash",money(x.cash)],["Paper equity",money(x.equity)],["Daily P/L",money(x.daily_pnl)],
 ["Realized P/L",money(x.realized_pnl)],["Fees paid",money(x.fees_paid)],
 ["Auto mode",x.auto_trading?"Running":"Stopped"],["Daily lock",x.daily_lock?"Locked":"Clear"],
 ["Entries today",x.entries_today],["Loss streak",x.loss_streak]
 ];
 document.querySelector("#cards").innerHTML=cards.map(([a,b])=>`<div class=card><div class=label>${a}</div><div class=value>${b}</div></div>`).join("");
 document.querySelector("#signal").textContent=JSON.stringify(s,null,2)+(x.last_error?`\n\nLast error: ${x.last_error}`:"");
 document.querySelector("#position").textContent=x.position?JSON.stringify(x.position,null,2):"None";
 const rows=(x.trades||[]).slice(-20).reverse();
 document.querySelector("#trades").innerHTML=rows.length?`<table><tr><th>Time</th><th>Side</th><th>Notional</th><th>Price</th><th>Fee</th><th>P/L</th><th>Reason</th></tr>${rows.map(t=>`<tr><td>${new Date(t.time).toLocaleString()}</td><td>${t.side}</td><td>${money(t.notional)}</td><td>${money(t.price)}</td><td>${money(t.fee)}</td><td class="${t.pnl>=0?'good':'bad'}">${money(t.pnl)}</td><td>${t.reason}</td></tr>`).join("")}</table>`:"No trades yet.";
}
async function post(path){
 const r=await fetch(path,{method:"POST"}); if(!r.ok){const x=await r.json();alert(x.detail||"Action failed")} load();
}
async function resetAccount(){if(confirm("Erase the paper account and trade history?"))await post("/api/reset")}
load();setInterval(load,5000);
</script>
</body>
</html>
