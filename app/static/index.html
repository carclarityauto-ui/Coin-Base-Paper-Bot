<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapid Multi-Crypto</title>
<style>body{font-family:system-ui;background:#0d1118;color:#eee;max-width:1000px;margin:auto;padding:20px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.c{background:#18202b;border:1px solid #344055;border-radius:12px;padding:14px}button{padding:12px;margin:8px;border:0;border-radius:8px;font-weight:700}pre{white-space:pre-wrap}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #344055}</style>
<h1>Rapid Multi-Crypto Paper Scalper</h1><div class=c><b>Paper money only — HIGH RISK TEST PROFILE.</b> BTC, ETH, SOL and XRP. Larger simulated positions and looser entries. No profit guarantee.</div><div id=cards class=g></div>
<button onclick="p('/api/auto/start')">Start Auto</button><button onclick="p('/api/auto/stop')">Stop Auto</button><button onclick="p('/api/reset')">Reset</button>
<div class=g><div class=c><h2>Rankings</h2><pre id=r></pre></div><div class=c><h2>Position</h2><pre id=pos></pre></div></div><div class=c><h2>Recent trades</h2><div id=t></div></div>
<script>const m=x=>Number(x||0).toLocaleString(undefined,{style:'currency',currency:'USD'});async function load(){let x=await fetch('/api/status?'+Date.now()).then(r=>r.json());cards.innerHTML=[['Version',x.version],['Cash',m(x.cash)],['Equity',m(x.equity)],['Daily P/L',m(x.daily_pnl)],['Realized P/L',m(x.realized_pnl)],['Fees',m(x.fees_paid)],['Auto',x.auto_trading?'Running':'Stopped'],['Entries',x.entries_today]].map(a=>`<div class=c><small>${a[0]}</small><h2>${a[1]}</h2></div>`).join('');r.textContent=JSON.stringify((x.rankings||[]).map(s=>({product:s.product,score:+s.score.toFixed(3),price:s.price,buy:s.buy,sell:s.sell,move:+s.estimated_move_pct.toFixed(3),cost:+s.round_trip_cost_pct.toFixed(3),blockers:s.blockers})),null,2)+(x.last_error?'\n'+x.last_error:'');pos.textContent=x.position?JSON.stringify(x.position,null,2):'None';let z=(x.trades||[]).slice(-15).reverse();t.innerHTML=z.length?'<table><tr><th>Pair</th><th>Side</th><th>Notional</th><th>Fee</th><th>P/L</th><th>Reason</th></tr>'+z.map(q=>`<tr><td>${q.product}</td><td>${q.side}</td><td>${m(q.notional)}</td><td>${m(q.fee)}</td><td>${m(q.pnl)}</td><td>${q.reason}</td></tr>`).join('')+'</table>':'No trades yet.'}async function p(u){await fetch(u,{method:'POST'});load()}load();setInterval(load,3000)</script>
